name: Testler

# Hızlı testler (ağ ve gerçek model gerekmez) Linux, macOS ve Windows'ta çalışır.
# Tam kurulum denemesi için: kurulum-testi.yml
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hizli:
    name: Hızlı testler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            choco install ffmpeg -y --no-progress
          fi
          ffmpeg -version

      - name: Hafif bağımlılıklar
        run: python -m pip install numpy scipy Pillow fonttools cryptography pypdf pypdfium2

      - name: Testler
        env:
          PYTHONUTF8: "1"
          YST_TARAYICI_YOK: "1"
        shell: bash
        run: |
          set -o pipefail
          python sistem/testler/calistir.py 2>&1 | tee test-sonuclari.log

      - name: Test günlüğü
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}
          path: test-sonuclari.log
          if-no-files-found: ignore
