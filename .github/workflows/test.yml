name: Testler

# Hızlı testler (ağ ve gerçek model gerekmez) Linux, macOS ve Windows'ta çalışır.
# Tam kurulum denemesi için: kurulum-testi.yml
# Kota koruması: yalnızca ELLE çalışır (GitHub → Actions → Testler → Run workflow). push/pull_request'te otomatik çalışmaz.
# Public depoda Actions ücretsizdir; o zaman push ve pull_request tetikleyicileri geri eklenebilir.
on:
  workflow_dispatch:

jobs:
  hizli:
    name: Hızlı testler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            choco install ffmpeg -y --no-progress
          fi
          ffmpeg -version | head -1

      - name: Hafif bağımlılıklar
        run: python -m pip install numpy scipy Pillow fonttools cryptography pypdf pypdfium2

      - name: Testler
        env:
          PYTHONUTF8: "1"
          YST_TARAYICI_YOK: "1"
        run: python sistem/testler/calistir.py
